<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alisediq Ataee — Professional Portfolio</title>
    <meta name="description" content="Motivated and customer-focused professional with experience in customer handling, data entry, purchase order management, and administrative support.">
    
    <!-- Design System Web Typography Framework -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ─── PREMIUM SPLIT-GRID ARCHITECTURE ─────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
        
        :root {
            --ink: #0c0c0d;
            --ink-2: #141416;
            --ink-3: #1b1b1e;
            --bone: #ece8e1;
            --ash: #8b8983;
            --faint: #343438;
            --line: rgba(236, 232, 225, 0.08);
            --font-display: "Bricolage Grotesque", sans-serif;
            --font-body: "Inter", sans-serif;
            --font-mono: "JetBrains Mono", monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            background: var(--ink);
            color: var(--bone);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Fluid Backdrop Glow Matrix */
        .atmos {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
              radial-gradient(50vw 50vw at 10% 10%, rgba(236, 232, 225, 0.04), transparent 60%),
              radial-gradient(45vw 45vw at 90% 90%, rgba(236, 232, 225, 0.03), transparent 60%);
        }

        /* Master Dashboard Framing */
        .dashboard-canvas {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            gap: 2rem;
            background: var(--ink-2);
            border: 1px solid var(--line);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.6);
        }

        @media (max-width: 950px) {
            body { padding: 1rem; }
            .dashboard-canvas { grid-template-columns: 1fr; gap: 0; }
            .profile-panel { border-right: none !important; border-bottom: 1px solid var(--line); }
        }

        /* ─── LEFT CONSOLE MESH: FOCUS FOCUS PANEL ────────────── */
        .profile-panel {
            background: var(--ink-3);
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-right: 1px solid var(--line);
        }

        .avatar-frame {
            width: 160px;
            height: 160px;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(236, 232, 225, 0.15);
            margin-bottom: 2rem;
            transform: rotate(-2deg);
            transition: transform 0.4s var(--ease);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .profile-panel:hover .avatar-frame { transform: rotate(0deg) scale(1.04); }
        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }

        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            letter-spacing: -0.04em;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }
        .subtitle-badge {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            text-transform: uppercase;
            color: var(--ash);
            letter-spacing: 0.08em;
            background: rgba(236, 232, 225, 0.04);
            padding: 0.3rem 0.8rem;
            border-radius: 100px;
            border: 1px solid var(--line);
            margin-bottom: 3rem;
        }

        .meta-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            text-align: left;
            border-top: 1px solid var(--line);
            padding-top: 2.5rem;
        }
        .meta-item span {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: #56544f;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.2rem;
        }
        .meta-item p, .meta-item a {
            color: var(--bone);
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
        }

        /* ─── RIGHT CONSOLE MESH: SYSTEM FLOW CORE ────────────── */
        .data-flow-panel {
            padding: 4rem 3.5rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
            max-height: 85vh;
            overflow-y: auto;
        }
        @media (max-width: 950px) { .data-flow-panel { max-height: none; padding: 3rem 2rem; } }

        /* Custom Scrollbar for Right Panel */
        .data-flow-panel::-webkit-scrollbar { width: 6px; }
        .data-flow-panel::-webkit-scrollbar-track { background: transparent; }
        .data-flow-panel::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 10px; }

        .block-title {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--ash);
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--line);
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .desc-text { color: var(--ash); font-size: 0.98rem; line-height: 1.6; }

        .timeline-track { display: flex; flex-direction: column; gap: 2rem; }
        .timeline-node { border-left: 2px solid var(--line); padding-left: 1.5rem; position: relative; }
        .timeline-node:hover { border-left-color: var(--bone); }
        .node-time { font-family: var(--font-mono); font-size: 0.8rem; color: #56544f; margin-bottom: 0.2rem; }
        .timeline-node h3 { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.01em; }
        .timeline-node h4 { color: var(--ash); font-size: 0.95rem; font-weight: 400; margin-bottom: 0.5rem; }
        .timeline-node p { color: var(--ash); font-size: 0.9rem; }

        .highlight-stack { display: flex; flex-direction: column; gap: 0.6rem; }
        .highlight-card { background: rgba(236, 232, 225, 0.02); border: 1px solid var(--line); padding: 0.9rem 1.25rem; border-radius: 12px; font-size: 0.9rem; color: var(--ash); line-height: 1.5; }

        .pill-mesh { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .pill-chip {
            background: var(--ink-3);
            border: 1px solid var(--line);
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: border-color 0.2s;
        }
        .pill-chip:hover { border-color: var(--bone); }

        .lang-flex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.6rem; }
        .lang-card {
            background: var(--ink-3);
            border: 1px solid var(--line);
            padding: 0.6rem 1rem;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }
        .lang-card span:last-child { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ash); }
    </style>
</head>
